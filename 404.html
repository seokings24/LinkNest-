<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinkNest</title>
<style>
body{margin:0;background:#070b12;color:#eef5fb;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}
.box{text-align:center;border:1px solid #1d2a3a;background:#0d1420;border-radius:16px;padding:35px;max-width:420px}
h1{margin:0 0 8px;font-size:22px}p{color:#8497ae;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="box"><h1>Opening link…</h1><p id="status">Please wait.</p></div>
<script>
(() => {
  const match = location.pathname.match(/\/go\/([^/]+)\/?$/i);
  if (!match) { location.replace("./"); return; }

  const slug = decodeURIComponent(match[1]);
  let links = [];
  try { links = JSON.parse(localStorage.getItem("linknest_browser_links_v3") || "[]"); } catch {}

  const item = Array.isArray(links) ? links.find(x => x.slug === slug) : null;

  if (item && /^https?:\/\//i.test(item.destination)) {
    document.getElementById("status").textContent = "Redirecting…";
    location.replace(item.destination);
  } else {
    document.getElementById("status").textContent =
      "Link not found in this browser.";
  }
})();
</script>
</body>
</html>
